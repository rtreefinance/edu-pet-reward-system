version: "3.8"

services:
  # ---- MongoDB ----
  mongodb:
    image: mongo:7
    container_name: pet-reward-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pet-reward
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      start-period: 20s
      retries: 5

  # ---- Backend API + Static Frontend ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pet-reward-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      MONGO_URI: mongodb://mongodb:27017/pet-reward
      JWT_SECRET: pet-reward-prod-secret-change-me
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: wget -qO- http://localhost:3001/api/health || exit 1
      interval: 30s
      timeout: 5s
      start-period: 15s
      retries: 3

volumes:
  mongo-data:
    driver: local
